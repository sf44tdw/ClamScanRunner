name: Shell syntax check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bash-syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            git ls-files -z -- '*.sh' '*.bash' \
              'clamscanrunner'
          )

          if (( ${#scripts[@]} == 0 )); then
            echo "::error::No shell scripts found to check."
            exit 1
          fi

          for script in "${scripts[@]}"; do
            echo "Checking ${script}"
            bash -n "$script"
          done
